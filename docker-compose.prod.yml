services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  automation-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  backend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G

  worker:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
